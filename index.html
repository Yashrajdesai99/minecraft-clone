<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Survival Sandbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
        }

        .crosshair-line {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.7);
        }

        .crosshair-h {
            width: 10px;
            height: 2px;
            left: 50%;
            top: 50%;
            transform: translateY(-50%);
        }

        .crosshair-v {
            width: 2px;
            height: 10px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #debug-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border: 1px solid #0f0;
            pointer-events: auto;
            z-index: 100;
            min-width: 200px;
        }

        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            pointer-events: auto;
            z-index: 50;
        }

        .hotbar-slot {
            width: 40px;
            height: 40px;
            background: rgba(100, 100, 100, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .hotbar-slot.selected {
            border-color: rgba(255, 255, 0, 1);
            background: rgba(150, 150, 0, 0.8);
        }

        #pause-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: white;
            pointer-events: auto;
            z-index: 1000;
            display: none;
            min-width: 300px;
        }

        #pause-menu.active {
            display: block;
        }

        #pause-menu h1 {
            margin-bottom: 30px;
            font-size: 32px;
        }

        #pause-menu button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(100, 100, 100, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        #pause-menu button:hover {
            background: rgba(150, 150, 150, 0.9);
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 2000;
            pointer-events: auto;
        }

        #loading-screen.hidden {
            display: none;
        }

        .loading-text {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .loading-bar {
            width: 300px;
            height: 30px;
            background: rgba(100, 100, 100, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #0f0, #00ff00);
            width: 0%;
            transition: width 0.1s;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="hud">
        <div id="crosshair">
            <div class="crosshair-line crosshair-h"></div>
            <div class="crosshair-line crosshair-v"></div>
        </div>
        
        <div id="debug-info">
            <div>FPS: <span id="fps">0</span></div>
            <div>Pos: <span id="pos">0,0,0</span></div>
            <div>Chunk: <span id="chunk">0,0</span></div>
            <div>Loaded: <span id="loaded">0</span></div>
            <div>Rendered: <span id="rendered">0</span></div>
        </div>
        
        <div id="hotbar">
            <div class="hotbar-slot selected">1</div>
            <div class="hotbar-slot">2</div>
            <div class="hotbar-slot">3</div>
            <div class="hotbar-slot">4</div>
            <div class="hotbar-slot">5</div>
            <div class="hotbar-slot">6</div>
            <div class="hotbar-slot">7</div>
            <div class="hotbar-slot">8</div>
            <div class="hotbar-slot">9</div>
        </div>
    </div>
    
    <div id="pause-menu">
        <h1>PAUSED</h1>
        <button onclick="game.unpause()">Resume</button>
        <button onclick="game.openSettings()">Settings</button>
        <button onclick="game.saveWorld()">Save</button>
        <button onclick="game.mainMenu()">Main Menu</button>
    </div>
    
    <div id="loading-screen">
        <div class="loading-text">Initializing World...</div>
        <div class="loading-bar">
            <div class="loading-progress" id="loading-progress"></div>
        </div>
    </div>

    <script type="module" src="/src/index.ts"></script>
</body>
</html>
